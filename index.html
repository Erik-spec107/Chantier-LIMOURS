<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F6E56">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chantier">
<title>Chantier La Courneuve</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --green:#0F6E56;--green-light:#E1F5EE;--green-dark:#085041;
    --blue:#185FA5;--blue-light:#E6F1FB;
    --amber:#854F0B;--amber-light:#FAEEDA;
    --coral:#993C1D;--coral-light:#FAECE7;
    --border:#e0e0e0;--bg:#f5f5f3;--white:#fff;
    --text:#1a1a1a;--text2:#666;--text3:#999;
    --radius:12px;--radius-sm:8px;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .header{background:var(--green);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20}
  .header h1{font-size:16px;font-weight:600}
  .header p{font-size:12px;opacity:0.75;margin-top:2px}
  .search-wrap{padding:12px 16px;background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:56px;z-index:19}
  .search-inner{position:relative}
  .search-inner svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .search-inner input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s}
  .search-inner input:focus{border-color:var(--green)}
  .contacts{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .card-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
  .avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0}
  .av0{background:var(--blue-light);color:var(--blue)}
  .av1{background:var(--green-light);color:var(--green-dark)}
  .av2{background:var(--amber-light);color:var(--amber)}
  .av3{background:var(--coral-light);color:var(--coral)}
  .card-info{flex:1;min-width:0}
  .card-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-role{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chevron{width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0;transition:transform .2s}
  .card.open .chevron{transform:rotate(180deg)}
  .card-body{display:none;border-top:1px solid var(--border);padding:12px 16px 14px}
  .card.open .card-body{display:block}
  .info-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;font-size:13px}
  .info-row:last-child{margin-bottom:0}
  .info-row svg{width:16px;height:16px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;margin-top:1px}
  .info-row .label{color:var(--text2);min-width:60px;font-size:12px}
  .info-row .val{color:var(--text);flex:1}
  .info-row a{color:var(--green);text-decoration:none;font-weight:500}
  .note-box{background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;color:var(--text2);margin-top:8px;line-height:1.5}
  .card-actions{display:flex;gap:8px;margin-top:12px}
  .btn-act{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 8px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;text-decoration:none;border:none;cursor:pointer}
  .btn-call{background:var(--green-light);color:var(--green-dark)}
  .btn-mail{background:var(--blue-light);color:var(--blue)}
  .btn-act svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .add-wrap{padding:4px 16px 32px}
  .btn-add{width:100%;padding:13px;border:1.5px dashed var(--border);border-radius:var(--radius);background:transparent;color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-add svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
  .status{text-align:center;font-size:12px;padding:10px 16px 0}
  .status.loading{color:var(--green)}
  .status.error{color:#c0392b}
  .empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-end;justify-content:center}
  .modal-overlay.open{display:flex}
  .modal{background:var(--white);border-radius:20px 20px 0 0;padding:20px 16px 40px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto}
  .modal-title{font-size:16px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
  .btn-close{background:none;border:none;cursor:pointer;padding:4px;color:var(--text3)}
  .btn-close svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
  .field{margin-bottom:12px}
  .field label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px;font-weight:500}
  .field input,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;color:var(--text);outline:none;font-family:inherit}
  .field input:focus,.field textarea:focus{border-color:var(--green)}
  .field textarea{height:64px;resize:vertical}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modal-actions{display:flex;gap:10px;margin-top:16px}
  .btn-save{flex:1;padding:12px;border:none;border-radius:var(--radius-sm);background:var(--green);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  .btn-save:disabled{background:var(--text3);cursor:not-allowed}
  .btn-cancel{padding:12px 18px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--text2);font-size:14px;cursor:pointer}
  @media(min-width:600px){
    body{display:flex;flex-direction:column;align-items:center}
    .header,.search-wrap,.contacts,.add-wrap,.status{width:100%;max-width:520px}
    .modal{border-radius:20px;margin-bottom:40px}
  }
</style>
</head>
<body>

<div class="header">
  <h1>🏗 Chantier La Courneuve</h1>
  <p>Répertoire des intervenants</p>
</div>

<div class="search-wrap">
  <div class="search-inner">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search" placeholder="Rechercher…" oninput="filterContacts()">
  </div>
</div>

<div class="status loading" id="status">Chargement des contacts…</div>
<div class="contacts" id="contacts-list"></div>
<div class="add-wrap">
  <button class="btn-add" onclick="openModal()">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Ajouter un contact
  </button>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title">
      <span>Nouveau contact</span>
      <button class="btn-close" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="field"><label>Entreprise *</label><input id="f-entreprise" type="text" placeholder="Nom de l'entreprise"></div>
    <div class="field"><label>Contact (nom)</label><input id="f-contact" type="text" placeholder="ex: M. Dupont"></div>
    <div class="field-row">
      <div class="field"><label>Portable</label><input id="f-portable" type="tel" placeholder="06 …"></div>
      <div class="field"><label>Fixe</label><input id="f-fixe" type="tel" placeholder="01 …"></div>
    </div>
    <div class="field"><label>Mail</label><input id="f-mail" type="email" placeholder="contact@entreprise.fr"></div>
    <div class="field-row">
      <div class="field"><label>Adresse</label><input id="f-adresse" type="text" placeholder="Rue…"></div>
      <div class="field"><label>Ville</label><input id="f-ville" type="text" placeholder="Paris"></div>
    </div>
    <div class="field"><label>Code postal</label><input id="f-cp" type="text" placeholder="75000" style="max-width:120px"></div>
    <div class="field"><label>Note</label><textarea id="f-note" placeholder="Informations complémentaires…"></textarea></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-save" id="btn-save" onclick="saveContact()">Enregistrer</button>
    </div>
  </div>
</div>

<script>
const SHEET_ID = '1b8oU0_PDWo5dyC6dBES_6vKn29kvUBqKU-NFkdDT1Nc';
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxBD0jpSEZJIVwfX8oW3bq8F0gxDYs6AIjTyK5dFQkjqH9sBGY2cCO3uUY9S1Nc0K2v/exec';
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
const COLORS = ['av0','av1','av2','av3'];
let allContacts = [];

function initials(name){
  if(!name) return '?';
  return name.split(/\s+/).filter(w=>w.length>1).slice(0,2).map(w=>w[0].toUpperCase()).join('') || name.slice(0,2).toUpperCase();
}

async function loadContacts(){
  setStatus('Chargement…','loading');
  try{
    const res = await fetch(SHEET_URL+'&nocache='+Date.now());
    const text = await res.text();
    const json = JSON.parse(text.replace(/^[^{]+/,'').replace(/[^}]+$/,''));
    const rows = json.table.rows;
    const cols = json.table.cols.map(c=>c.label.toLowerCase().trim());
    allContacts = rows.map((r,i)=>{
      const obj={_id:i};
      cols.forEach((col,ci)=>{ obj[col]=r.c[ci]?(r.c[ci].v||'').toString().trim():''; });
      return obj;
    }).filter(c=>c.entreprise);
    setStatus('','');
    renderContacts(allContacts);
  }catch(e){
    setStatus('Erreur de chargement — vérifie le partage du Sheet.','error');
    console.error(e);
  }
}

function setStatus(msg,cls){
  const el=document.getElementById('status');
  el.textContent=msg;
  el.className='status '+(cls||'');
  el.style.display=msg?'block':'none';
}

function renderContacts(contacts){
  const list=document.getElementById('contacts-list');
  if(!contacts.length){list.innerHTML='<div class="empty">Aucun contact trouvé</div>';return;}
  list.innerHTML=contacts.map((c,i)=>{
    const av=COLORS[i%COLORS.length];
    const ini=initials(c.entreprise);
    const tel=c.portable||c.fixe||'';
    const telDisplay=[c.portable,c.fixe].filter(Boolean).join(' / ');
    const addrParts=[c.adresse,c.cp,c.ville].filter(Boolean).join(', ');
    return `<div class="card" id="card-${c._id}">
      <div class="card-head" onclick="toggleCard(${c._id})">
        <div class="avatar ${av}">${ini}</div>
        <div class="card-info">
          <div class="card-name">${c.entreprise}</div>
          ${c.contact?`<div class="card-role">${c.contact}</div>`:tel?`<div class="card-role">${tel}</div>`:''}
        </div>
        <svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="card-body">
        ${c.contact?`<div class="info-row"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="label">Contact</span><span class="val">${c.contact}</span></div>`:''}
        ${telDisplay?`<div class="info-row"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 8.83a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 0h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L7.59 7.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 14.92z"/></svg><span class="label">Tél</span><span class="val"><a href="tel:${tel.replace(/\s/g,'')}">${telDisplay}</a></span></div>`:''}
        ${c.mail?`<div class="info-row"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><span class="label">Mail</span><span class="val"><a href="mailto:${c.mail}">${c.mail}</a></span></div>`:''}
        ${addrParts?`<div class="info-row"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span class="label">Adresse</span><span class="val">${addrParts}</span></div>`:''}
        ${c.note?`<div class="note-box">${c.note}</div>`:''}
        <div class="card-actions">
          ${tel?`<a class="btn-act btn-call" href="tel:${tel.replace(/\s/g,'')}"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 8.83a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 0h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L7.59 7.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 14.92z"/></svg>Appeler</a>`:''}
          ${c.mail?`<a class="btn-act btn-mail" href="mailto:${c.mail}"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Email</a>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(id){
  const card=document.getElementById('card-'+id);
  const wasOpen=card.classList.contains('open');
  document.querySelectorAll('.card.open').forEach(c=>c.classList.remove('open'));
  if(!wasOpen) card.classList.add('open');
}

function filterContacts(){
  const q=document.getElementById('search').value.toLowerCase();
  if(!q){renderContacts(allContacts);return;}
  renderContacts(allContacts.filter(c=>Object.values(c).join(' ').toLowerCase().includes(q)));
}

function openModal(){
  ['entreprise','contact','portable','fixe','mail','adresse','ville','cp','note'].forEach(f=>{
    const el=document.getElementById('f-'+f);if(el)el.value='';
  });
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('f-entreprise').focus(),100);
}
function closeModal(){document.getElementById('modal').classList.remove('open');}

async function saveContact(){
  const entreprise=document.getElementById('f-entreprise').value.trim();
  if(!entreprise){document.getElementById('f-entreprise').focus();return;}
  const btn=document.getElementById('btn-save');
  btn.disabled=true;btn.textContent='Envoi…';
  const data={
    entreprise,
    contact:document.getElementById('f-contact').value.trim(),
    portable:document.getElementById('f-portable').value.trim(),
    adresse:document.getElementById('f-adresse').value.trim(),
    ville:document.getElementById('f-ville').value.trim(),
    cp:document.getElementById('f-cp').value.trim(),
    fixe:document.getElementById('f-fixe').value.trim(),
    mail:document.getElementById('f-mail').value.trim(),
    note:document.getElementById('f-note').value.trim()
  };
  try{
    await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(data),mode:'no-cors'});
    closeModal();
    setTimeout(loadContacts,1500);
  }catch(e){
    alert('Erreur lors de l\'enregistrement.');
  }finally{
    btn.disabled=false;btn.textContent='Enregistrer';
  }
}

document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});
loadContacts();
</script>
</body>
</html>
